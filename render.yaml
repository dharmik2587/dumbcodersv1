services:
  - type: web
    name: hackmate
    env: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      # Without MESSAGE_ENCRYPTION_KEY every message send/list fails in production.
      - key: MESSAGE_ENCRYPTION_KEY
        sync: false
      # Browser Pusher keys are inlined at build time, so they must exist before the build runs.
      - key: NEXT_PUBLIC_PUSHER_KEY
        sync: false
      - key: NEXT_PUBLIC_PUSHER_CLUSTER
        value: ap2

  - type: cron
    name: sync-hackathons-cron
    env: node
    schedule: "0 */6 * * *"
    startCommand: 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$NEXT_PUBLIC_APP_URL/api/cron/ingest"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
