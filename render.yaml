services:
  - type: web
    name: hackmate
    env: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      # Server message encryption key
      - key: MESSAGE_ENCRYPTION_KEY
        value: a3f8902c5e632b437ea2e1d0002bfd6b814d580f2bbb4040a151e48395fce5a7
      # Browser Pusher keys are inlined at build time, so they must exist before the build runs.
      - key: NEXT_PUBLIC_PUSHER_KEY
        sync: false
      - key: NEXT_PUBLIC_PUSHER_CLUSTER
        value: ap2

  - type: cron
    name: sync-hackathons-cron
    env: node
    schedule: "0 */6 * * *"
    startCommand: 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$NEXT_PUBLIC_APP_URL/api/cron/ingest"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
